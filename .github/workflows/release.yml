# Builds HoldupSetup.exe and publishes it as a GitHub Release whenever a v* tag (e.g. v0.1.0) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches pyproject.toml
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match pyproject.toml version $version"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -e ".[build]"

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: pwsh
        run: |
          ./build.ps1
          # build.ps1 only warns when Inno Setup is missing; a release without the installer is a failure.
          if (-not (Test-Path dist\HoldupSetup.exe)) { throw "dist\HoldupSetup.exe was not built" }

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # The site links to releases/latest/download/HoldupSetup.exe: keep the asset name.
        run: gh release create "${{ github.ref_name }}" dist/HoldupSetup.exe --title "Holdup ${{ github.ref_name }}" --generate-notes
