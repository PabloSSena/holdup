# Builds Holdup for Windows, macOS (Apple Silicon and Intel) and Linux whenever a v* tag (e.g. v1.1.0) is pushed,
# then publishes all of them as one GitHub Release, only once every build has passed.
# Run it by hand (Actions → Release → Run workflow) to build and test without publishing: the files are kept as
# workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The site links to releases/latest/download/<file>: keep these names.
          - name: windows
            os: windows-latest
            files: dist/HoldupSetup.exe
          - name: macos-apple-silicon
            os: macos-latest
            files: dist/Holdup-macOS-AppleSilicon.dmg
          - name: macos-intel
            os: macos-15-intel
            files: dist/Holdup-macOS-Intel.dmg
          - name: linux
            os: ubuntu-22.04  # the oldest glibc on offer, so the build runs on more distributions
            files: |
              dist/Holdup-x86_64.AppImage
              dist/Holdup-linux-amd64.deb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches pyproject.toml
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Qt's runtime needs (tests run it offscreen) and dpkg-deb for the .deb.
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libfontconfig1 libdbus-1-3 dpkg
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"  # runners have no FUSE to mount AppImages
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python; else py=.venv/bin/python; fi
          echo "PY=$py" >> "$GITHUB_ENV"
          $py -m pip install --upgrade pip
          $py -m pip install -e ".[dev,build]"

      - name: Test
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: $PY -m pytest

      - name: Install Inno Setup if missing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1

      - name: Build (macOS, Linux)
        if: runner.os != 'Windows'
        run: $PY build.py

      - name: Check every file was built
        shell: bash
        # build.ps1 only warns when Inno Setup is missing; a release without the installer is a failure.
        run: |
          for file in ${{ matrix.files }}; do
            [ -f "$file" ] || { echo "::error::$file was not built"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: holdup-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "Holdup ${{ github.ref_name }}" --generate-notes
